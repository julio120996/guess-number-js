<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Super Adivina Bros</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <div class="game-card" id="game-card">
    <h1>🍄 Super Adivina Bros</h1>
    <p class="subtitle">Salta al tubo secreto: adivina el número del 1 al 100</p>

    <div class="hud">
      <p id="puntos">🪙 Puntos: 0</p>
      <p id="contador">Intentos: 0</p>
      <p id="record">🏆 Récord: --</p>
    </div>

    <div class="controls">
      <input type="number" id="inputIntento" min="1" max="100" placeholder="?">
      <button id="btnAdivinar">¡Saltar!</button>
    </div>

    <p id="mensaje"></p>
    <p id="historial">Historial: </p>

    <button id="btnReiniciar" style="display: none;">
      🔄 Siguiente nivel
    </button>
  </div>

  <script src="Script.js"></script>
</body>
</html>
